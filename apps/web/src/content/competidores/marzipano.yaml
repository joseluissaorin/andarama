notas: "Licencia Apache 2.0, sin precio de licencia. La web aclara que no es un producto oficial de Google, y el repositorio github.com/google/marzipano está archivado (solo lectura; último cambio en octubre de 2023), así que ya no recibe mantenimiento. Incluye una herramienta web básica (Marzipano Tool) para tours sencillos; el resto exige programar. Fuentes: https://www.marzipano.net y https://github.com/google/marzipano (27-9-2026)."
