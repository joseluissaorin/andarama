notas: "Precios comprobados el 11-10-2026 en https://www.thinglink.com/plans/edu, /plans/higher-education y /plans/business. Teacher: 9 $ al mes con pago anual, para un docente, sin cuentas gratuitas para el alumnado. Planes de centro (Essential, Enhanced) con precio a medida; Department desde 4250 $ al año y College desde 8500 $ al año, con LTI 1.3. Create Starter / XR: 57 € al mes con pago anual u 86 € al mes. Apps para Meta Quest, PICO, HTC VIVE y ClassVR. Dice cumplir WCAG 2.2 AA e integra Immersive Reader. Empresa: Thinglink Oy (Kontiolahti, Finlandia), ISO 27001."
