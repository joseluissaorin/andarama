rol:
  es: Autor de Andarama
  en: Author of Andarama
  pt: Autor do Andarama
  fr: Auteur d'Andarama
  de: Autor von Andarama
  it: Autore di Andarama
  ja: Andaramaの作者
bio:
  es: >-
    Desarrollador y filólogo. Escribe Andarama, un programa de código abierto para crear recorridos
    virtuales 360, y lo usa en la universidad para enseñar con fotos esféricas. Aquí cuenta lo que
    va aprendiendo: comparativas con precios comprobados, cómo se monta una escape room en 360 y
    por qué los recorridos deberían poder exportarse siempre.
  en: >-
    Developer and philologist. He writes Andarama, an open-source program for creating 360 virtual
    tours, and uses it at university to teach with spherical photos. Here he shares what he keeps
    learning: comparisons with verified prices, how to build a 360 escape room and why tours should
    always be exportable.
  pt: >-
    Programador e filólogo. Escreve o Andarama, um programa de código aberto para criar tours
    virtuais 360, e usa-o na universidade para ensinar com fotos esféricas. Aqui conta o que vai
    aprendendo: comparações com preços verificados, como montar uma escape room em 360 e por que os
    tours deveriam poder ser sempre exportados.
  fr: >-
    Développeur et philologue. Il écrit Andarama, un logiciel libre pour créer des visites
    virtuelles 360, et s'en sert à l'université pour enseigner avec des photos sphériques. Il
    raconte ici ce qu'il apprend : des comparatifs aux prix vérifiés, comment monter un escape game
    en 360 et pourquoi une visite devrait toujours pouvoir s'exporter.
  de: >-
    Entwickler und Philologe. Er schreibt Andarama, ein Open-Source-Programm für virtuelle
    360-Grad-Rundgänge, und nutzt es an der Universität, um mit sphärischen Fotos zu unterrichten.
    Hier erzählt er, was er dabei lernt: Vergleiche mit geprüften Preisen, wie man einen Escape Room
    in 360 baut und warum sich Rundgänge immer exportieren lassen sollten.
  it: >-
    Sviluppatore e filologo. Scrive Andarama, un programma open source per creare tour virtuali
    360, e lo usa all'università per insegnare con foto sferiche. Qui racconta quello che impara:
    confronti con prezzi verificati, come si monta un'escape room in 360 e perché i tour dovrebbero
    potersi esportare sempre.
  ja: >-
    開発者であり文献学者。オープンソースの360度バーチャルツアー作成ソフト「Andarama」を開発し、大学で全天球写真を使った授業に活用しています。ここでは、確認済みの価格による比較、360度脱出ゲームの作り方、ツアーが常にエクスポートできるべき理由など、学んだことを綴っています。
