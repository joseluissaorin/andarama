<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Andarama">
  <!-- Versión enmascarable: el fondo llega a sangre y la criatura queda
       dentro de la zona segura (80 % central), porque Android recorta el
       icono con la forma que le apetezca al sistema. -->
  <rect width="64" height="64" fill="#ff8a00" />
  <g transform="translate(32 32.5) scale(.74) translate(-32 -32)">
  <g transform="rotate(-3 32 32)">
    <!-- Desregistro: la misma silueta, una tinta más oscura, un pelín movida -->
    <g fill="#e8501a" transform="translate(1.8 2)">
      <path d="M32 8.5 C44 7.5 54 17 54.5 29 C55 40 49 49 39 51.5 C36.5 52.2 27.5 52.2 25 51.5 C15 49 9 40 9.5 29 C10 17 20 7.5 32 8.5 Z" />
      <ellipse cx="21.5" cy="54.2" rx="6.5" ry="4.5" />
      <ellipse cx="42.5" cy="56" rx="7" ry="4.5" />
    </g>
    <!-- La criatura -->
    <g fill="#ffd900">
      <path d="M32 8.5 C44 7.5 54 17 54.5 29 C55 40 49 49 39 51.5 C36.5 52.2 27.5 52.2 25 51.5 C15 49 9 40 9.5 29 C10 17 20 7.5 32 8.5 Z" />
      <ellipse cx="21.5" cy="54.2" rx="6.5" ry="4.5" />
      <ellipse cx="42.5" cy="56" rx="7" ry="4.5" />
    </g>
    <!-- La cara -->
    <g fill="#33260f">
      <ellipse cx="25.5" cy="28" rx="2" ry="3.7" />
      <ellipse cx="38.5" cy="28" rx="2" ry="3.7" />
    </g>
    <path d="M25 35 Q32 41.5 39 35" fill="none" stroke="#33260f" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="19.5" cy="34.5" r="2.8" fill="#ff8a00" opacity=".6" />
    <circle cx="44.5" cy="34.5" r="2.8" fill="#ff8a00" opacity=".6" />
  </g>
  </g>
</svg>
