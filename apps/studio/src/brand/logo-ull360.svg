<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ULL360">
  <!--
    Marca de producto de ULL360. No es la marca institucional de la Universidad
    de La Laguna ni una modificación de ella —esa se usa aparte y tiene sus
    propias condiciones—: aquí solo se toma el violeta corporativo (Pantone
    2597 C) y se construye un símbolo propio, la esfera panorámica vista con su
    ecuador, que es lo que hace este programa.
  -->
  <defs>
    <linearGradient id="u3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d0aa4" />
      <stop offset="1" stop-color="#450569" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#u3-bg)" />
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- Esfera -->
    <circle cx="32" cy="32" r="16.5" stroke-width="3.4" />
    <!-- Ecuador: el panorama da la vuelta -->
    <ellipse cx="32" cy="32" rx="16.5" ry="6.6" stroke-width="2.6" opacity=".92" />
    <!-- Meridiano, para que se lea como esfera y no como diana -->
    <ellipse cx="32" cy="32" rx="6.6" ry="16.5" stroke-width="2.2" opacity=".55" />
  </g>
  <!-- Punto de interés sobre el ecuador -->
  <circle cx="44.7" cy="27.4" r="4.3" fill="#ffd166" stroke="#450569" stroke-width="1.6" />
</svg>
