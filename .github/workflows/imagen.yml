name: Imagen Docker

# Publica la imagen de la instalación propia en GHCR:
#   ghcr.io/joseluissaorin/andarama
# - Etiqueta vX.Y.Z  -> :X.Y.Z, :X.Y y :latest
# - Rama main        -> :main y :sha-<commit>
# Multiarquitectura (linux/amd64 y linux/arm64). Cada arquitectura se construye
# en un runner nativo (sin QEMU: pnpm y Vite emulados tardarían una eternidad)
# y un último paso junta los dos resultados en un solo manifiesto.
#
# Tras la primera publicación, comprobar en GitHub → Packages → andarama →
# Package settings que la visibilidad es «Public»; si no, `docker pull` pide
# credenciales.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/andarama

jobs:
  construir:
    strategy:
      fail-fast: true
      matrix:
        include:
          - plataforma: linux/amd64
            runner: ubuntu-24.04
          - plataforma: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la plataforma para los artefactos
        run: echo "PAR=${{ matrix.plataforma }}" | sed 's#/#-#g' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          labels: |
            org.opencontainers.image.title=Andarama
            org.opencontainers.image.description=Recorridos virtuales 360 de código abierto: instalación propia (Node.js + SQLite)
            org.opencontainers.image.licenses=EUPL-1.2

      - name: Construir y subir por digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.plataforma }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGEN }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PAR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAR }}

      - name: Humo de la imagen
        run: |
          docker run -d --name andarama -p 8788:8788 -e APP_SECRET=ci-secret "${{ env.IMAGEN }}@${{ steps.build.outputs.digest }}"
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8788/api/v1/health > /dev/null; then
              curl -sf http://localhost:8788/api/v1/config | grep -q '"auth":"local"' || { echo "La instancia no arranca en modo de cuentas propias"; exit 1; }
              exit 0
            fi
            sleep 2
          done
          docker logs andarama
          exit 1

      - name: Guardar el digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PAR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      - name: Crear el manifiesto multiarquitectura
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGEN }}@sha256:%s ' *)

      - name: Comprobar
        run: docker buildx imagetools inspect "${{ env.IMAGEN }}:${{ steps.meta.outputs.version }}"
