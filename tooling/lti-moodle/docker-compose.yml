# Moodle 4.5 LTS de pruebas para el LTI 1.3 de Andarama.
#
# Moodle vive en http://localhost:8080 (tanto para el navegador como para el
# propio contenedor). Andarama corre en el anfitrión con
# PUBLIC_URL=http://andarama.test:8795; el contenedor llega a él por
# host-gateway y el navegador de Playwright, con --host-resolver-rules.
# Instrucciones completas en README.md.
name: andarama-lti-moodle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle"]
      interval: 5s
      retries: 20

  moodle:
    image: erseco/alpine-moodle:v4.5.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SITE_URL: http://localhost:8080
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin-lti-2026
      MOODLE_EMAIL: admin@moodle.test
      MOODLE_SITENAME: Moodle_LTI_Andarama
      MOODLE_LANGUAGE: en
      SMTP_HOST: ""
    ports:
      - "8080:8080"
    extra_hosts:
      - "andarama.test:host-gateway"
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html
      - ./moodle-setup.sh:/usr/local/bin/moodle-setup.sh:ro

volumes:
  pgdata:
  moodledata:
  moodlehtml:
